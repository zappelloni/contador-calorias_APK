# Monta o APK do app no GitHub e publica em "Releases" para baixar no celular.
name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk ContadorDeCalorias.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Contador de Calorias (versão ${{ github.run_number }})
          body: Abra no celular Android, baixe o ContadorDeCalorias.apk e toque em Instalar.
          files: ContadorDeCalorias.apk
          make_latest: true
